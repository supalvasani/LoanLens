version: 2

models:
  - name: int_transactions_categorized
    columns:
      - name: raw_id
        tests: [not_null, unique]
      - name: applicant_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_applicants')
              field: raw_applicant_id
      - name: category
        tests: [not_null]
      - name: txn_type
        tests:
          - accepted_values:
              values: ['credit', 'debit']

  - name: int_monthly_income_summary
    columns:
      - name: applicant_id
        tests: [not_null, unique]
      - name: avg_monthly_income
        tests: [not_null]
      - name: income_stability_score
        tests: [not_null]

  - name: int_monthly_obligation_summary
    columns:
      - name: applicant_id
        tests: [not_null, unique]
      - name: emi_burden_ratio
        tests: [not_null]
      - name: emi_burden_score
        tests: [not_null]

  - name: int_bounce_history
    columns:
      - name: applicant_id
        tests: [not_null, unique]
      - name: bounce_count
        tests: [not_null]
      - name: bounce_score
        tests: [not_null]

  - name: int_balance_trends
    columns:
      - name: applicant_id
        tests: [not_null, unique]
      - name: balance_score
        tests: [not_null]

  - name: int_spending_by_category
    columns:
      - name: applicant_id
        tests: [not_null]
      - name: category
        tests: [not_null]

  - name: int_combined_signals
    columns:
      - name: applicant_id
        tests: [not_null, unique]
      - name: income_stability_score
        tests: [not_null]
      - name: emi_burden_score
        tests: [not_null]
      - name: bounce_score
        tests: [not_null]
      - name: balance_score
        tests: [not_null]

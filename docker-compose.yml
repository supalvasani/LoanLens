# docker-compose.yml — LoanLens services
#
# Optional profiles:
#   ollama   — run a local Ollama LLM container (GPU or CPU).
#              Start with:  docker compose --profile ollama up -d
#              Then set in backend/.env:
#                LLM_BASE_URL=http://localhost:11434/v1
#                LLM_MODEL=llama3.1
#
# If Ollama is already installed and running on the HOST machine (not in
# Docker), point the backend to it using the host-gateway address:
#   LLM_BASE_URL=http://host.docker.internal:11434/v1  (Docker Desktop)
#   LLM_BASE_URL=http://172.17.0.1:11434/v1            (Linux docker bridge)
# No extra service entry is needed in that case.

services:
  postgres:
    image: postgres:16
    container_name: loanlens_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin  
      POSTGRES_DB: loanlens_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loanlens_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  airflow:
    image: apache/airflow:latest
    container_name: loanlens_airflow
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # LocalExecutor: no Redis, no Celery, no separate worker needed
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:admin@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      # dbt env vars — points to postgres container via internal Docker DNS
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_USER: postgres
      DBT_PASSWORD: admin
      DBT_DBNAME: loanlens_db
      _PIP_ADDITIONAL_REQUIREMENTS: 'dbt-core>=1.8.0,<2.0.0 dbt-postgres>=1.8.0,<2.0.0 dbt-bigquery>=1.8.0,<2.0.0 psycopg2-binary faker'
    ports:
      - "8080:8080"
    volumes:
      - airflow_logs:/opt/airflow/logs
      - ./backend/airflow/dags:/opt/airflow/dags
      - ./backend/data:/opt/airflow/data
      - ./dbt:/opt/airflow/dbt
    # standalone = runs db migrate + create admin + webserver + scheduler in one process
    command: standalone

  # ── Optional: Ollama LLM (start with --profile ollama) ─────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: loanlens_ollama
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support (NVIDIA): uncomment the lines below and ensure the
    # NVIDIA Container Toolkit is installed on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  airflow_logs:
  ollama_data:

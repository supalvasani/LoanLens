services:
  postgres:
    image: postgres:16
    container_name: loanlens_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin  
      POSTGRES_DB: loanlens_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loanlens_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  airflow:
    image: apache/airflow:latest
    container_name: loanlens_airflow
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # LocalExecutor: no Redis, no Celery, no separate worker needed
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:admin@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      # dbt env vars — points to postgres container via internal Docker DNS
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_USER: postgres
      DBT_PASSWORD: admin
      DBT_DBNAME: loanlens_db
      _PIP_ADDITIONAL_REQUIREMENTS: dbt-core dbt-postgres dbt-bigquery psycopg2-binary faker
    ports:
      - "8080:8080"
    volumes:
      - airflow_logs:/opt/airflow/logs
      - ./backend/airflow/dags:/opt/airflow/dags
      - ./backend/data:/opt/airflow/data
      - ./dbt:/opt/airflow/dbt
    # standalone = runs db migrate + create admin + webserver + scheduler in one process
    command: standalone

volumes:
  pgdata:
  airflow_logs:

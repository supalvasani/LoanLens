# SonarQube / SonarCloud Configuration for LoanLens

sonar.projectKey=LoanLens
sonar.projectName=LoanLens

# Source directories to analyze
sonar.sources=.

# Files & directories to exclude from analysis (compiled outputs, build artifacts, dbt target)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.ruff_cache/**,\
  **/.venv/**,\
  **/venv/**,\
  **/dbt/loanlens/target/**,\
  **/dbt/**/target/**,\
  **/dbt/**/dbt_packages/**,\
  **/dbt/**/logs/**,\
  **/logs/**

# Exclude SQL models and static declarations from Code Coverage requirements
# (dbt SQL transformations are validated via dbt tests, not standard unit test runners)
sonar.coverage.exclusions=\
  dbt/**,\
  **/*.sql,\
  frontend/src/vite-env.d.ts

# Exclude generated code and DBT target directories from duplicate code analysis (CPD)
sonar.cpd.exclusions=\
  **/dbt/loanlens/target/**,\
  **/dbt/**/target/**,\
  **/*.sql
